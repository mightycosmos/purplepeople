<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purple People Card News</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <style>
        body {
            width: 1080px;
            height: 1080px;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
        }
        
        /* Define theme colors based on bg_color context */
        {% if bg_color == 'purple' %}
        :root { --theme-color: #c084fc; } /* Purple */
        {% elif bg_color == 'blue' %}
        :root { --theme-color: #60a5fa; } /* Blue */
        {% elif bg_color == 'red' %}
        :root { --theme-color: #f87171; } /* Red */
        {% else %}
        :root { --theme-color: #ebd96f; } /* Default Yellow */
        {% endif %}
        
        .theme-bg { background-color: var(--theme-color); }
        .theme-text { color: var(--theme-color); }
    </style>
</head>
<body class="font-sans bg-black">
    <div class="relative w-full h-full">
        <!-- Logo Area -->
        <div class="absolute top-[120px] left-[100px] right-0 h-[150px] theme-bg flex items-end pl-8 pb-3">
            <div class="flex flex-col">
                <span class="text-black text-[28px] font-bold tracking-tight leading-none ml-[4px] mb-[2px]">Purple People</span>
                <span class="text-black text-[110px] font-black tracking-tighter leading-none">News 10</span>
            </div>
        </div>
        
        <!-- Content Area -->
        <div class="absolute top-[360px] left-[100px] pr-[100px]">
            <!-- Title -->
            <div class="mb-20">
                {% for line in title %}
                <h1 class="theme-text text-[75px] font-extrabold leading-[1.35] tracking-[-0.05em] break-keep">
                    {{ line }}
                </h1>
                {% endfor %}
            </div>
            
            <!-- Details -->
            <div class="space-y-5">
                {% for detail in details %}
                <p class="theme-text text-[52px] font-bold leading-[1.45] tracking-[-0.03em] break-keep">
                    {{ detail }}
                </p>
                {% endfor %}
            </div>
        </div>
    </div>
</body>
</html>
