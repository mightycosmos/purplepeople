<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purple People Card News</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <style>
        body {
            width: 1080px;
            height: 1080px;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Pretendard', sans-serif;
        }
    </style>
</head>
{% if card_type == 'cover' %}
<body class="bg-black flex items-center justify-center p-20">
    <div class="text-white text-center">
        <h1 class="text-[90px] font-extrabold leading-[1.3] break-keep tracking-[-0.03em]">{{ content }}</h1>
    </div>
</body>
{% elif card_type == 'closing' %}
<body class="bg-purple-600 flex items-center justify-center p-20">
    <div class="text-white text-center">
        <h1 class="text-[80px] font-extrabold leading-[1.4] break-keep tracking-[-0.03em] whitespace-pre-line">{{ content }}</h1>
    </div>
</body>
{% else %}
<body class="bg-gray-100 p-[100px] flex flex-col justify-center">
    <div class="w-full bg-white rounded-[40px] p-[80px] shadow-2xl flex flex-col justify-center h-full border-t-[24px] border-purple-500 relative">
        <div class="absolute top-[40px] right-[50px] text-gray-300 font-black text-[42px] tracking-widest">{{ side }}</div>
        <div class="text-purple-600 font-black text-[50px] mb-8 tracking-widest">{{ media }}</div>
        <h1 class="text-black text-[65px] font-extrabold leading-[1.3] tracking-[-0.04em] break-keep mb-10">
            {{ title }}
        </h1>
        <p class="text-gray-700 text-[48px] font-medium leading-[1.6] tracking-[-0.02em] break-keep border-l-8 border-gray-300 pl-8">
            {{ desc }}
        </p>
    </div>
</body>
{% endif %}
</html>
