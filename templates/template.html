<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Purple People Card News</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <style>
        body {
            width: 1080px;
            height: 1080px;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Pretendard', sans-serif;
        }
    </style>
</head>
{% if card_type == 'cover' %}
<body class="bg-black flex items-center justify-center p-20">
    <div class="text-white text-center">
        <h1 class="text-[90px] font-extrabold leading-[1.3] break-keep tracking-[-0.03em]">{{ content }}</h1>
    </div>
</body>
{% elif card_type == 'closing' %}
<body class="bg-purple-600 flex items-center justify-center p-20">
    <div class="text-white text-center">
        <h1 class="text-[80px] font-extrabold leading-[1.4] break-keep tracking-[-0.03em] whitespace-pre-line">{{ content }}</h1>
    </div>
</body>
{% else %}
<body class="bg-gray-100 p-[80px] flex flex-col justify-center">
    <div class="w-full bg-white rounded-[40px] px-[70px] py-[60px] shadow-2xl flex flex-col h-full border-t-[24px] border-purple-500 overflow-hidden">
        <div class="flex items-baseline justify-between mb-8">
            <div class="text-purple-600 font-black text-[46px] tracking-widest">{{ media }}</div>
            <div class="flex items-baseline gap-4">
                <span class="text-gray-800 font-black text-[44px]">{{ "%02d"|format(page) }}</span>
                <span class="font-black text-[36px] tracking-widest {{ 'text-blue-500' if side == 'Left' else 'text-red-500' }}">{{ side }}</span>
            </div>
        </div>
        <h1 id="title" class="text-black text-[58px] font-extrabold leading-[1.28] tracking-[-0.04em] break-keep mb-8">
            {{ title }}
        </h1>
        <p id="desc" class="text-gray-700 text-[40px] font-medium leading-[1.62] tracking-[-0.02em] break-keep border-l-8 border-purple-200 pl-8 flex-1">
            {{ desc }}
        </p>
    </div>
    <script>
        // 본문 길이가 들쭉날쭉해도 카드 밖으로 넘치지 않도록 글자 크기를 줄여 맞춘다.
        (function fit() {
            const card = document.querySelector('div.bg-white');
            const desc = document.getElementById('desc');
            let size = 40;
            while (card.scrollHeight > card.clientHeight && size > 24) {
                size -= 1;
                desc.style.fontSize = size + 'px';
            }
        })();
    </script>
</body>
{% endif %}
</html>
